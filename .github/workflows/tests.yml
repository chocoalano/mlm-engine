name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Lowest supported: Laravel 13 needs PHP 8.3, so 8.2 means Laravel 12.
          - php: '8.2'
            laravel: '12.*'
            testbench: '10.*'
          - php: '8.4'
            laravel: '13.*'
            testbench: '11.*'

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, zip
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      # A library's lock is never installed by its consumers, so each leg
      # resolves fresh against the Laravel version it is testing.
      - name: Install dependencies
        run: |
          composer update --prefer-dist --no-interaction --no-progress \
            --with="laravel/framework:${{ matrix.laravel }}" \
            --with="orchestra/testbench:${{ matrix.testbench }}"

      - name: Run tests
        run: composer test

  pint:
    name: Pint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, zip
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test config src tests
